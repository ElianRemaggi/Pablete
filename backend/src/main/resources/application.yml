spring:
  application:
    name: siga
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true # declara y fuerza UTF-8 en request/response; sin esto algunos clientes
                  # (ej. PowerShell 5.1) asumen otro charset cuando el Content-Type no lo declara

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-exp-ms: ${JWT_ACCESS_EXP_MS:900000}      # 15 min
    refresh-token-exp-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 dias
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
