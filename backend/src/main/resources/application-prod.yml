spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/siga_db}
    username: ${DB_USERNAME:siga}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.instituto.siga: INFO
