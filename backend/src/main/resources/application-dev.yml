spring:
  datasource:
    url: jdbc:h2:mem:sigadb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true # deja que Hibernate cree el esquema antes de correr data.sql
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8 # sin esto, Spring lee data.sql con el charset por defecto de la JVM (Cp1252 en Windows), no UTF-8
  flyway:
    enabled: false

logging:
  level:
    com.instituto.siga: DEBUG
